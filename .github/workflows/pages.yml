name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup:offline
      - run: npm run build:pages
        env:
          PUBLIC_PROXY_BASE_URL: ${{ vars.PUBLIC_PROXY_BASE_URL }}
          PUBLIC_DEEPL_RELAY_URL: ${{ vars.PUBLIC_DEEPL_RELAY_URL }}
          PUBLIC_USE_PROXY: ${{ vars.PUBLIC_USE_PROXY }}
          PUBLIC_AUTO_SPEAKER: ${{ vars.PUBLIC_AUTO_SPEAKER }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
